<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101213"><title>Spira · Atlante della quiete</title><link rel="stylesheet" href="style.css"><script defer src="spira.js"></script><script defer src="https://telegram.org/js/telegram-web-app.js" onload="connectTelegram()"></script></head>
<body><main>
<header><div class="mark" aria-hidden="true">✺</div><div><h1>Spira</h1><small>ATLANTE DELLA QUIETE</small></div><button id="focus" aria-label="Mostra solo l’opera">Immergiti ↗</button></header>
<section id="plate" aria-label="Opera generativa"><canvas></canvas><div class="folio">TAVOLA <b id="number"></b></div><button id="motion" aria-label="Pausa animazione"></button><div class="caption"><small id="latin"></small><h2 id="title"></h2><p id="verse"></p></div></section>
<section class="desk"><div class="legend"><small>SPETTRO DEI CHAKRA</small><span>01 — 07</span></div><div id="colors" role="group" aria-label="Chakra"></div>
<div class="audio"><button id="play" aria-pressed="false">▷ Ascolta</button><label><small>PAESAGGIO</small><select id="voice"><option>Corde</option><option>Marea</option><option>Campane</option></select></label><label><small>VOLUME</small><input id="level" aria-label="Volume" type="range" min="0" max="34" value="13"></label></div></section></main>
<button id="back" hidden>↙ Torna all’atlante</button><script>document.addEventListener("DOMContentLoaded",()=>window.connectTelegram?.())</script></body></html>
